name: forge_senior_project_version
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  
  # Routing
  go_router: ^14.0.0
  firebase_storage: ^12.4.10
  image_picker: ^1.2.1
  # Direct dep so web registrant / tree-shaking reliably includes the web impl.
  image_picker_for_web: ^3.1.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: images/forgeIcon.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: images/forgeIcon.png
  remove_alpha_ios: true
  background_color_ios: "#000000"

flutter:
  uses-material-design: true
  assets:
    - images/forgeIcon.png
    - images/forgeWordmarkWhite.png
  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
